<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إدارة المواصلات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f5; padding: 20px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #1a3c6c; margin: 0; font-size: 24px;}
        button.refresh { background: #1a3c6c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;}
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #ddd; font-size: 14px;}
        th { background-color: #1a3c6c; color: white; }
        tr:hover { background-color: #f5f5f5; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold;}
        .bg-bus { background: #cce5ff; color: #004085; }
        .bg-micro { background: #fff3cd; color: #856404; }
        .bg-car { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 لوحة تحكم الحجوزات - جامعة الفيوم</h1>
        <button class="refresh" onclick="loadData()">تحديث البيانات 🔄</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>الموبايل</th>
                <th>الخط</th>
                <th>نوع الرحلة</th>
                <th>المركبة</th>
                <th>التاريخ</th>
                <th>الوقت</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="7" style="text-align:center;">جاري تحميل البيانات...</td></tr>
        </tbody>
    </table>

    <script>
        async function loadData() {
            try {
                const response = await fetch('/api/bookings');
                const bookings = await response.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                if(bookings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">لا توجد حجوزات حتى الآن.</td></tr>';
                    return;
                }

                bookings.forEach(b => {
                    let vehicleClass = b.vehicleType === 'أوتوبيس' ? 'bg-bus' : (b.vehicleType === 'ميكروباص' ? 'bg-micro' : 'bg-car');
                    
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${b.name}</strong></td>
                            <td>${b.phone}</td>
                            <td>${b.route}</td>
                            <td>${b.tripType}</td>
                            <td><span class="badge ${vehicleClass}">${b.vehicleType}</span></td>
                            <td>${b.date}</td>
                            <td>${b.time}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                alert("حدث خطأ في جلب البيانات");
            }
        }

        // تحميل البيانات أول ما الصفحة تفتح
        loadData();
    </script>
</body>
</html>
